<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const ADMIN_PASSWORD = "pga2026";
const PAR = 70;
const MC_PENALTY_STROKES = 78;
const MC_PENALTY_TO_PAR = MC_PENALTY_STROKES - PAR; // +8
const DROPS = 2;
const PICKS_PER_PERSON = 8;
const ESPN_API = "https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard";
const STORAGE_KEY = "pga-pool-participants-2026";

function fmt(n) {
  if (n === null || n === undefined) return "-";
  if (n === 0) return "E";
  return n > 0 ? "+" + n : "" + n;
}
function cls(n) {
  if (n === null || n === undefined) return "even";
  if (n < 0) return "under";
  if (n > 0) return "over";
  return "even";
}
function norm(s) { return (s || "").trim().toLowerCase(); }

function parseESPN(data) {
  const players = {};
  const events = data && data.events ? data.events : [];
  if (!events.length) return players;

  const event = events.find(function(e) {
    return e.name && (e.name.toLowerCase().includes("pga championship") || e.name.toLowerCase().includes("pga"));
  }) || events[0];
  const comps = (event && event.competitions && event.competitions[0] && event.competitions[0].competitors) ? event.competitions[0].competitors : [];

  comps.forEach(function(comp) {
    const name = (comp.athlete && comp.athlete.displayName) ? comp.athlete.displayName : "";
    if (!name) return;

    const linescores = comp.linescores || [];
    const roundStrokes = [null, null, null, null];
    const roundsTP = [null, null, null, null];
    let thru = "-";
    let teeTime = null;

    linescores.forEach(function(ls) {
      const roundIdx = (ls.period || 1) - 1;
      if (roundIdx < 0 || roundIdx > 3) return;
      const innerHoles = ls.linescores || [];
      const isComplete = innerHoles.length === 18;
      const dv = String(ls.displayValue != null ? ls.displayValue : "").trim();
      const dvNum = dv === "E" ? 0 : Number(dv);

      if (isComplete) {
        const total = innerHoles.reduce(function(a, h) { return a + (Number(h.value) || 0); }, 0);
        roundStrokes[roundIdx] = total || Number(ls.value);
        if (!isNaN(dvNum)) roundsTP[roundIdx] = dvNum;
        thru = "F";
      } else if (innerHoles.length > 0) {
        thru = String(innerHoles.length);
      }
    });

    try {
      const stats = (comp.statistics && comp.statistics.categories && comp.statistics.categories[0] && comp.statistics.categories[0].stats) ? comp.statistics.categories[0].stats : [];
      const teeEntry = stats[stats.length - 1];
      if (teeEntry && teeEntry.displayValue && /May/i.test(teeEntry.displayValue)) {
        const d = new Date(teeEntry.displayValue);
        if (!isNaN(d)) {
          teeTime = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
        }
      }
    } catch(e) {}

    if (thru === "-" && teeTime) thru = teeTime;

    const scoreStr = String(comp.score != null ? comp.score : "").trim();
    let topar = 0;
    if (scoreStr === "E") topar = 0;
    else if (scoreStr !== "" && scoreStr !== "-") {
      const n = Number(scoreStr);
      if (!isNaN(n)) topar = n;
    }

    const statusDetail = (comp.status && comp.status.type && comp.status.type.name) ? comp.status.type.name : "";
    const isMC = statusDetail.toLowerCase().includes("cut") || statusDetail.toLowerCase().includes("eliminated");
    const isWD = statusDetail.toLowerCase().includes("withdraw");

    players[norm(name)] = {
      name: name, pos: (comp.status && comp.status.type && comp.status.type.shortDetail) ? comp.status.type.shortDetail : "-",
      topar: topar, rounds: roundsTP, strokes: roundStrokes,
      thru: thru, status: isMC ? "cut" : isWD ? "wd" : "active", teeTime: teeTime,
    };
  });
  return players;
}

function computePickScore(name, playerMap) {
  const p = playerMap[norm(name)];
  if (!p) return { name: name, rounds: [null,null,null,null], total: 0, status: "unknown" };
  return { name: name, rounds: p.rounds, strokes: p.strokes, total: p.topar, status: p.status, thru: p.thru, pos: p.pos };
}

function computeParticipantScore(participant, playerMap) {
  const pickScores = participant.picks.filter(Boolean).map(function(name) { return computePickScore(name, playerMap); });
  const sorted = pickScores.slice().sort(function(a, b) { return a.total - b.total; });
  const kept = sorted.slice(0, 6);
  const droppedNames = new Set(sorted.slice(6).map(function(p) { return p.name; }));
  const grandTotal = kept.reduce(function(a, p) { return a + p.total; }, 0);
  return { pickScores: pickScores, droppedNames: droppedNames, grandTotal: grandTotal };
}

async function parsePicksExcel(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const wb = XLSX.read(e.target.result, { type: "array", cellFormula: true, cellNF: false, raw: false });
        const wsName = wb.SheetNames.includes("My Picks") ? "My Picks" : wb.SheetNames[0];
        const ws = wb.Sheets[wsName];
        if (!ws) { reject(new Error("No 'My Picks' sheet found.")); return; }

        function getCellVal(addr) {
          const cell = ws[addr];
          if (!cell) return "";
          const v = cell.v !== undefined && cell.v !== null ? String(cell.v).trim() : "";
          const w = cell.w !== undefined && cell.w !== null ? String(cell.w).trim() : "";
          return v || w || "";
        }

        const participantName = getCellVal("C5");
        if (!participantName) { reject(new Error("No name in YOUR NAME cell.")); return; }
        const picks = [];
        const pickAddrs = ["C8","C9","C10","C11","C12","C13","C14","C15"];
        for (const addr of pickAddrs) {
          const val = getCellVal(addr);
          if (val) picks.push(val);
        }
        const tiebreaker = getCellVal("C16") || null;
        resolve({ name: participantName, picks: picks.concat(Array(PICKS_PER_PERSON).fill("")).slice(0, PICKS_PER_PERSON), tiebreaker: tiebreaker });
      } catch (err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

const JSONBIN_BIN_ID = "69d67dd6aaba882197d8b175";
const JSONBIN_KEY = "$2a$10$ThYZbqfZHSHJybW7JdaBpOWXtrVXjhCkl/HDD.SZBaMeDc1R4LM62";
const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;

async function loadParticipants() {
  try {
    const res = await fetch(JSONBIN_URL + "/latest", {
      headers: { "X-Master-Key": JSONBIN_KEY, "X-Bin-Meta": "false" }
    });
    if (!res.ok) { return []; }
    const json = await res.json();
    return (json.record && json.record.participants) ? json.record.participants : (json.participants || []);
  } catch (e) { return []; }
}

async function saveParticipants(data) {
  try {
    await fetch(JSONBIN_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY, "X-Bin-Meta": "false" },
      body: JSON.stringify({ participants: data })
    });
  } catch (e) { console.error("Save exception:", e); }
}

function PGAPool() {
  const [tab, setTab] = useState("pool");
  const [participants, setParticipants] = useState([]);
  const [participantsLoading, setParticipantsLoading] = useState(true);
  const [playerMap, setPlayerMap] = useState({});
  const [rawData, setRawData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [expandedRow, setExpandedRow] = useState(null);
  const [adminAuthed, setAdminAuthed] = useState(false);
  const [adminPw, setAdminPw] = useState("");
  const [adminErr, setAdminErr] = useState("");
  const [editP, setEditP] = useState([]);
  const [newName, setNewName] = useState("");
  const [saveMsg, setSaveMsg] = useState("");
  const [uploadResult, setUploadResult] = useState(null);
  const [uploadErr, setUploadErr] = useState("");
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef(null);

  const fetchScores = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      let data;
      try {
        const res = await fetch("https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard?dates=20260514");
        if (res.ok) data = await res.json();
      } catch(e) {}
      if (!data || !data.events || !data.events.length) {
        const res = await fetch(ESPN_API);
        if (!res.ok) throw new Error("ESPN API returned " + res.status);
        data = await res.json();
      }
      setRawData(data); setPlayerMap(parseESPN(data)); setLastUpdated(new Date());
    } catch (e) { setError("Could not load live scores: " + e.message); }
    finally { setLoading(false); }
  }, []);

  useEffect(function() { fetchScores(); }, [fetchScores]);

  useEffect(function() {
    (async function() {
      setParticipantsLoading(true);
      const data = await loadParticipants();
      setParticipants(data);
      setParticipantsLoading(false);
    })();
  }, []);

  const poolRows = participants.map(function(p) {
    return Object.assign({}, p, computeParticipantScore(p, playerMap));
  }).sort(function(a, b) { return a.grandTotal - b.grandTotal; });

  const allPlayers = Object.values(playerMap).sort(function(a, b) { return a.topar - b.topar; });

  function handleLogin() {
    if (adminPw === ADMIN_PASSWORD) {
      setAdminAuthed(true); setAdminErr(""); setEditP(JSON.parse(JSON.stringify(participants)));
    } else setAdminErr("Incorrect password.");
  }

  async function saveAll() {
    const cleaned = editP.map(function(p) { return Object.assign({}, p, { picks: p.picks.filter(function(x) { return x && x.trim(); }) }); });
    setSaveMsg("Saving...");
    await saveParticipants(cleaned);
    const confirmed = await loadParticipants();
    setParticipants(confirmed);
    setEditP(JSON.parse(JSON.stringify(confirmed)));
    setSaveMsg("Saved! (" + confirmed.length + " participants)");
    setTimeout(function() { setSaveMsg(""); }, 4000);
  }

  function addParticipant() {
    if (!newName.trim()) return;
    setEditP(function(prev) { return prev.concat([{ name: newName.trim(), picks: Array(PICKS_PER_PERSON).fill(""), tiebreaker: null }]); });
    setNewName("");
  }

  function removePart(idx) { setEditP(function(prev) { return prev.filter(function(_, i) { return i !== idx; }); }); }

  function updatePick(pIdx, pickIdx, val) {
    setEditP(function(prev) {
      return prev.map(function(p, i) {
        if (i !== pIdx) return p;
        const picks = p.picks.slice(); picks[pickIdx] = val; return Object.assign({}, p, { picks: picks });
      });
    });
  }

  async function handleFile(file) {
    setUploadErr(""); setUploadResult(null);
    if (!file) return;
    try {
      const result = await parsePicksExcel(file);
      const existsIdx = editP.findIndex(function(p) { return norm(p.name) === norm(result.name); });
      if (existsIdx >= 0) {
        setEditP(function(prev) { return prev.map(function(p, i) { return i === existsIdx ? Object.assign({}, p, { picks: result.picks, tiebreaker: result.tiebreaker }) : p; }); });
        setUploadResult(Object.assign({}, result, { action: "updated" }));
      } else {
        setEditP(function(prev) { return prev.concat([result]); });
        setUploadResult(Object.assign({}, result, { action: "added" }));
      }
    } catch (e) { setUploadErr(e.message || "Could not read file."); }
  }

  const tournamentName = (rawData && rawData.events && rawData.events[0] && rawData.events[0].name) ? rawData.events[0].name : "2026 PGA Championship";

  const TABS = [
    { key: "pool",  label: "Pool Standings" },
    { key: "live",  label: "Live Leaderboard" },

    { key: "admin", label: "Admin" },
  ];

  return (
    <div className="app">
      <div className="header">
        <div className="header-flag">⛳ Aronimink Golf Club · May 2026</div>
        <h1>PGA <span>Championship</span> Pool</h1>
        <div className="header-badge">108th PGA Championship · Newtown Square, PA</div>
        <div className="header-sub">Pick 8 · Worst 2 Dropped · MC = 78 strokes (+8/round) per unplayed round</div>
        {lastUpdated && <div className="last-updated">Scores from ESPN · Updated {lastUpdated.toLocaleTimeString()}</div>}
      </div>

      <div className="tabs">
        {TABS.map(function(t) {
          return <button key={t.key} className={"tab-btn" + (tab === t.key ? " active" : "")} onClick={function() { setTab(t.key); }}>{t.label}</button>;
        })}
      </div>

      {/* POOL STANDINGS */}
      {tab === "pool" && (
        <div className="card">
          <div className="card-header">
            <span className="card-title">Pool Standings</span>
            <button className="refresh-btn" onClick={fetchScores} disabled={loading}>
              <span className={loading ? "spin" : ""}>↻</span>{loading ? "Updating…" : "Refresh"}
            </button>
          </div>
          {participantsLoading
            ? <div className="loading"><span className="ico">⛳</span>Loading pool data…</div>
            : participants.length === 0
              ? <div className="loading">No participants yet — add them in Admin.</div>
              : loading && !Object.keys(playerMap).length
                ? <div className="loading"><span className="ico">⛳</span>Loading live scores…</div>
                : (
                  <table className="pool-table">
                    <thead><tr><th>#</th><th>Participant</th><th style={{textAlign:"right",paddingRight:14}}>Total</th></tr></thead>
                    <tbody>
                      {poolRows.map(function(row, i) {
                        const isExp = expandedRow === row.name;
                        const pc = i===0?"p1":i===1?"p2":i===2?"p3":"";
                        return (
                          <React.Fragment key={row.name}>
                            <tr className="participant-row" onClick={function() { setExpandedRow(isExp ? null : row.name); }}>
                              <td colSpan={3}>
                                <div className="participant-summary">
                                  <div className={"pos-num " + pc}>{i+1}</div>
                                  <div>
                                    <div className="p-name">
                                      {row.name}
                                      {row.tiebreaker && <span style={{fontSize:11,fontWeight:400,color:"rgba(200,168,75,0.65)",marginLeft:8}}>TB: {row.tiebreaker}</span>}
                                    </div>
                                    <div className="p-preview">
                                      {row.picks.filter(Boolean).slice(0,4).join(", ")}{row.picks.filter(Boolean).length > 4 ? "…" : ""}
                                    </div>
                                  </div>
                                  <div className={"p-total " + cls(row.grandTotal)}>{fmt(row.grandTotal)}</div>
                                </div>
                              </td>
                            </tr>
                            {isExp && (
                              <tr><td colSpan={3}>
                                <div className="picks-detail"><div className="picks-inner">
                                  <div className="picks-grid">
                                    {row.pickScores.map(function(ps) {
                                      const dropped = row.droppedNames.has(ps.name);
                                      const isMC = ps.status === "cut" || ps.status === "wd";
                                      const rStr = ps.rounds.map(function(r, ri) { return r !== null ? "R" + (ri+1) + ":" + fmt(r) : "R" + (ri+1) + ":-"; }).join(" ");
                                      return (
                                        <div key={ps.name} className={"pick-card" + (dropped ? " dropped" : "") + (isMC ? " mc" : "")}>
                                          <div>
                                            <div className="pick-name">{ps.name}</div>
                                            <div className="pick-detail">{isMC ? "MC/WD" : ps.status === "unknown" ? "?" : ps.thru ? "Thru " + ps.thru : ""}</div>
                                            <div className="pick-rounds">{rStr}</div>
                                          </div>
                                          <div>
                                            <div className={"pick-score " + (isMC ? "mc" : cls(ps.total))}>{fmt(ps.total)}</div>
                                            {dropped && <div className="drop-label">dropped</div>}
                                          </div>
                                        </div>
                                      );
                                    })}
                                  </div>
                                  {row.tiebreaker && <div className="tb-line">Tiebreaker: {row.tiebreaker}</div>}
                                </div></div>
                              </td></tr>
                            )}
                          </React.Fragment>
                        );
                      })}
                    </tbody>
                  </table>
                )
          }
        </div>
      )}

      {/* LIVE LEADERBOARD */}
      {tab === "live" && (
        <div className="card">
          <div className="card-header">
            <span className="card-title">{tournamentName}</span>
            <button className="refresh-btn" onClick={fetchScores} disabled={loading}>
              <span className={loading ? "spin" : ""}>↻</span>{loading ? "Updating…" : "Refresh"}
            </button>
          </div>
          {loading && !allPlayers.length
            ? <div className="loading"><span className="ico">⛳</span>Fetching live scores from ESPN…</div>
            : error ? <div className="error-block">{error}</div>
            : !allPlayers.length ? <div className="loading">No scores yet — tournament begins May 14.</div>
            : (
              <table className="live-table">
                <thead>
                  <tr><th style={{width:50}}>Pos</th><th>Player</th><th className="r">Total</th><th className="r">R1</th><th className="r">R2</th><th className="r">R3</th><th className="r">R4</th><th className="r">Thru</th><th className="r">Tee Time</th></tr>
                </thead>
                <tbody>
                  {allPlayers.map(function(p) {
                    return (
                      <tr key={p.name} className={p.status==="cut"||p.status==="wd" ? "cut-row" : ""}>
                        <td className="live-pos">{p.pos}</td>
                        <td><span className="live-name">{p.name}</span></td>
                        <td className="r"><span className={"score-pill " + cls(p.topar)}>{fmt(p.topar)}</span></td>
                        {p.strokes.map(function(s, i) { return <td key={i} className="r" style={{color:"rgba(240,236,224,0.62)"}}>{s !== null ? s : "—"}</td>; })}
                        <td className="r">
                          {p.status==="cut" ? <span className="thru-badge cut">CUT</span>
                          : p.status==="wd" ? <span className="thru-badge wd">WD</span>
                          : p.thru==="F" ? <span className="thru-badge active">F</span>
                          : /^\d+$/.test(p.thru) ? <span className="thru-badge active">{p.thru}</span>
                          : <span style={{fontSize:11,color:"rgba(240,236,224,0.44)"}}>{p.thru||"—"}</span>}
                        </td>
                        <td className="r" style={{fontSize:11,color:"rgba(240,236,224,0.44)"}}>
                          {/\d+:\d+/.test(p.thru||"") ? p.thru : p.teeTime || "—"}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )
          }
        </div>
      )}

      {/* ADMIN */}
      {tab === "admin" && (
        <div className="card">
          <div className="card-header"><span className="card-title">Admin</span></div>
          <div className="admin-wrap">
            {!adminAuthed ? (
              <div className="admin-login">
                <h3>Admin Login</h3>
                <input type="password" placeholder="Password" value={adminPw}
                  onChange={function(e) { setAdminPw(e.target.value); }}
                  onKeyDown={function(e) { if (e.key === "Enter") handleLogin(); }}/>
                <button className="btn" onClick={handleLogin}>Login</button>
                {adminErr && <div className="err">{adminErr}</div>}
              </div>
            ) : (
              <div>
                <div
                  className={"upload-zone" + (dragOver ? " over" : "")}
                  onClick={function() { if (fileRef.current) fileRef.current.click(); }}
                  onDragOver={function(e) { e.preventDefault(); setDragOver(true); }}
                  onDragLeave={function() { setDragOver(false); }}
                  onDrop={function(e) { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}>
                  <input ref={fileRef} type="file" accept=".xlsx" style={{display:"none"}}
                    onChange={function(e) { handleFile(e.target.files[0]); e.target.value = ""; }}/>
                  <div style={{fontSize:28,marginBottom:8}}>📥</div>
                  <h4>Drop participant's picks file here</h4>
                  <p>Or click to browse · Accepts PGA Pool picks template (.xlsx)</p>
                </div>
                {uploadErr && <div className="err" style={{marginBottom:12}}>⚠ {uploadErr}</div>}
                {uploadResult && (
                  <div className="upload-ok">
                    <h4>✓ {uploadResult.action === "updated" ? "Updated" : "Added"}: {uploadResult.name}</h4>
                    {uploadResult.picks.filter(Boolean).map(function(p, i) {
                      return <div key={i} className="upload-ok-row">Pick {i+1}: {p}</div>;
                    })}
                  </div>
                )}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif",color:"var(--gold-light)",fontSize:18,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>
                    Participants ({editP.length})
                  </div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    {saveMsg && <span className={saveMsg.includes("fail") ? "err" : "ok"}>{saveMsg}</span>}
                    <button className="btn" onClick={saveAll}>Save All</button>
                  </div>
                </div>
                <div className="add-box">
                  <div style={{fontSize:11,color:"var(--gold)",fontWeight:600,marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>Add Manually</div>
                  <div className="add-row">
                    <input type="text" placeholder="Name…" value={newName}
                      onChange={function(e) { setNewName(e.target.value); }}
                      onKeyDown={function(e) { if (e.key === "Enter") addParticipant(); }}/>
                    <button className="btn" onClick={addParticipant}>Add</button>
                  </div>
                </div>
                {editP.map(function(p, pIdx) {
                  return (
                    <div key={pIdx} className="p-item">
                      <div className="p-item-head">
                        <div className="p-item-name">
                          {p.name}
                          {p.tiebreaker && <span style={{fontSize:11,color:"var(--gold)",marginLeft:8,fontWeight:400}}>TB: {p.tiebreaker}</span>}
                        </div>
                        <button className="btn danger sm" onClick={function() { removePart(pIdx); }}>Remove</button>
                      </div>
                      <div className="picks-inputs">
                        {Array(PICKS_PER_PERSON).fill(null).map(function(_, pickIdx) {
                          return (
                            <div key={pickIdx}>
                              <div className="pick-lbl">Pick {pickIdx+1}</div>
                              <input type="text" placeholder="Golfer name…" value={p.picks[pickIdx] || ""}
                                onChange={function(e) { updatePick(pIdx, pickIdx, e.target.value); }}/>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
                <div style={{marginTop:14,fontSize:11,color:"rgba(240,236,224,0.28)"}}>💡 Hit Save All after making changes.</div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(PGAPool));
</script>
</body>
</html>
